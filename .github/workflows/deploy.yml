name: Deploy to Docker Hub

on:
  push:
    branches: [ "main" ] # Chạy khi có code mới đẩy lên nhánh main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # 1. Action lấy code từ Github
      - name: Checkout mã nguồn
        uses: actions/checkout@v6.0.2

      # 2. Action Đăng nhập Docker Hub
      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v4.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # (Khuyên dùng) Cài đặt Buildx để hỗ trợ build image tốt hơn
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Action Đóng gói & Đẩy Image
      - name: Build và Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tên image dựa theo thông tin trong file index.html của bạn
          tags: nguyenhoanganh111024/duanjava:latest
      - name: Triển khai lên DevOps Classroom
        run: |
          REPO="nguyenhoanganh111024/duanjava"
          CONTAINER_PORT=80
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}?repo=$REPO&tag=latest&slot=3&container_port=$CONTAINER_PORT&strict_container_port=0")
          BODY=$(echo "$RESPONSE" | sed "$d")
          CODE=$(echo "$RESPONSE" | tail -n1)
          echo "Webhook HTTP: $CODE"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Deploy thất bại. Xem chi tiết trong nhóm log bên dưới."
            echo "::group::Chi tiết webhook JSON"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
            echo "::endgroup::"
            exit 1
          fi
          echo "Deploy thành công."
          echo "::group::Chi tiết webhook JSON"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          echo "::endgroup::"
